services:
  web:
    build: .
    image: wildlife-camera-index
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      SAMPLES_DIR: /srv/app/samples
      VAL_PERCENT: "20"      # 验证集目标比例（按组哈希分桶）
      GAP_SECONDS: "60"      # 同相机相邻照片归组阈值（秒）
      # SPLIT_SALT: wildlife-trap-v1   # 改盐可整体重排训练/验证划分
    volumes:
      - wildlife-data:/data   # SQLite 库、各版本索引与可信恢复副本，容器重建后数据仍在
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  wildlife-data:
